<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 400px;
      min-height: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    h2 {
      margin: 0 0 16px 0;
      font-size: 18px;
      color: #333;
    }

    .button-container {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.2s;
    }

    #convertBtn {
      background: #4285f4;
      color: white;
    }

    #convertBtn:hover {
      background: #3367d6;
    }

    #copyBtn {
      background: #34a853;
      color: white;
    }

    #copyBtn:hover {
      background: #2d9247;
    }

    #copyBtn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
      background: white;
    }

    textarea:focus {
      outline: none;
      border-color: #4285f4;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }

    .instructions {
      margin-top: 16px;
      padding: 12px;
      background: #e8f0fe;
      border-radius: 4px;
      font-size: 12px;
      color: #1967d2;
    }
  </style>
</head>
<body>
  <h2>Page to Markdown</h2>
  
  <div class="button-container">
    <button id="convertBtn">Convert Selection</button>
    <button id="copyBtn" disabled>Copy to Clipboard</button>
  </div>
  
  <textarea id="output" placeholder="Select text on the page and click 'Convert Selection' to see markdown output here..."></textarea>
  
  <div class="status" id="status"></div>
  
  <div class="instructions">
    <strong>How to use:</strong><br>
    1. Select text on any webpage<br>
    2. Click this extension icon<br>
    3. Click "Convert Selection"<br>
    4. Copy the markdown result
  </div>

  <script src="popup.js"></script>
</body>
</html>
